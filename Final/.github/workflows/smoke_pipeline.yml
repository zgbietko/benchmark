name: smoke-pipeline
on: [push, pull_request]
jobs:
  smoke-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python run_workflow.py --help
      - run: python run_full_thesis_pipeline.py --help
